<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px;
    font: 13px/1.5 system-ui, sans-serif;
    padding: 16px;
    background: #1a1a2e;
    color: #e0e0e0;
  }
  h2 { font-size: 15px; margin-bottom: 12px; color: #fff; }
  label { display: block; margin-bottom: 4px; font-size: 12px; color: #aaa; }
  input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #16213e;
    color: #e0e0e0;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .toggle {
    position: relative; width: 44px; height: 24px;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute; inset: 0;
    background: #333; border-radius: 12px;
    cursor: pointer; transition: 0.2s;
  }
  .toggle .slider::before {
    content: ""; position: absolute;
    width: 18px; height: 18px; left: 3px; top: 3px;
    background: #ccc; border-radius: 50%;
    transition: 0.2s;
  }
  .toggle input:checked + .slider { background: #34a853; }
  .toggle input:checked + .slider::before { transform: translateX(20px); }
  .info {
    padding: 8px;
    background: #16213e;
    border-radius: 6px;
    font-size: 11px;
    color: #8899aa;
    line-height: 1.6;
  }
  .info code {
    background: #0f3460;
    padding: 1px 4px;
    border-radius: 3px;
    color: #66b2ff;
  }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 6px;
    border: none;
    border-radius: 6px;
    background: #0f3460;
    color: #66b2ff;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { background: #1a4a80; }
</style>
</head>
<body>
  <h2>Remote Pseudo Cursor</h2>

  <div class="toggle-row">
    <span>Enabled</span>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <label for="server">Relay Server URL</label>
  <input type="text" id="server" placeholder="ws://localhost:9090">

  <button id="save">Save &amp; Reconnect</button>

  <div class="info" style="margin-top: 12px">
    <strong>Setup:</strong><br>
    1. Run relay server: <code>node server/index.js</code><br>
    2. Open controller on phone: <code>http://PC_IP:9090</code><br>
    3. Touch your phone screen to move the cursor!
  </div>

<script src="popup.js"></script>
</body>
</html>
